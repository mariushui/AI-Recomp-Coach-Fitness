name: Test und Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Öffentliche Werte des Supabase-Projekts. Der Anon-Key ist fürs Frontend gedacht,
          # die Daten schützt Row Level Security. Repo-Variablen gleichen Namens haben Vorrang.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://psuwcwxzctfwenakuoss.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzdXdjd3h6Y3Rmd2VuYWt1b3NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3MDk2MjcsImV4cCI6MjEwOTI4NTYyN30.iQo2L3EM_OzmbPuKwugPvWnM6NRnO_QHzf1gKoUOwNA' }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
